<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucky Wheel</title>
<style>
:root{--bg:#fff7ec;--card:#ffffff;--ink:#2b1d14;--mute:#7a6555;--acc:#d9480f;--acc2:#2f9e44;--line:#f0dfc8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1510;--card:#2a1d15;--ink:#fbeedd;--mute:#c4a88f;--line:#4a3426}}
:root[data-theme="dark"]{--bg:#1d1510;--card:#2a1d15;--ink:#fbeedd;--mute:#c4a88f;--line:#4a3426}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
header{text-align:center;padding:28px 16px 8px}
h1{margin:0;font-size:1.9rem}
header p{margin:6px 0 0;color:var(--mute)}
main{max-width:640px;margin:0 auto;padding:12px 16px 40px}
section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:18px}
.wheelbox{position:relative;width:min(88vw,340px);margin:8px auto}
canvas{width:100%;height:auto;display:block}
.pin{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:32px solid #d9480f;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));z-index:2}
.btn{display:block;width:100%;max-width:340px;margin:14px auto 0;border:0;border-radius:999px;padding:14px;font-size:1.1rem;font-weight:700;color:#fff;background:var(--acc);cursor:pointer}
.btn:disabled{opacity:.6}
.btn.green{background:var(--acc2)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
#modal.show{display:flex}
.box{background:var(--card);border-radius:24px;padding:26px 22px;max-width:360px;width:100%;text-align:center;animation:pop .4s}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.prize{font-size:1.5rem;font-weight:800;margin:6px 0}
.link{display:block;margin-top:10px;color:var(--mute);background:none;border:0;cursor:pointer;width:100%;font-size:.95rem}
#adm{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:11;overflow:auto}#adm.show{display:flex}#adm input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1rem}
#adm .box{max-height:92vh;overflow:auto;text-align:left;padding:0;max-width:440px;border-radius:22px}
#adm .hd{background:linear-gradient(135deg,#d9480f,#f08c00);color:#fff;padding:18px 20px}
#adm .hd h2{margin:0;font-size:1.3rem}#adm .hd p{margin:4px 0 0;opacity:.9;font-size:.9rem}
#adm #login{padding:16px}#adm .bd2{padding:4px 16px 8px}
#adm .sec{font-weight:800;margin:18px 0 8px;font-size:1.05rem;color:var(--acc)}
#adm .lb{display:block;font-size:.8rem;color:var(--mute);margin:8px 0 3px}
#adm .legend{display:grid;gap:6px;margin-bottom:14px;font-size:.85rem}
#adm .legend span{padding:8px 10px;border-radius:10px;background:var(--bg);border-left:5px solid}
#adm .pr{border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:14px;padding:12px;margin-bottom:12px;background:var(--bg)}
#adm .pn{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-weight:700}
#adm .pn .em{width:54px;text-align:center;font-size:1.5rem;padding:6px}
#adm .pn .nm{flex:1;min-width:0;font-weight:700}
#adm .bd{font-size:.75rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 8px;white-space:nowrap;color:var(--mute)}
#adm .seg button{background:var(--card);color:var(--ink);padding:10px 4px;font-weight:600}
#adm .pr[data-m=u] .seg button[data-v=u]{background:#2f9e44;border-color:#2f9e44;color:#fff}
#adm .pr[data-m=l] .seg button[data-v=l]{background:#1c7ed6;border-color:#1c7ed6;color:#fff}
#adm .pr[data-m=z] .seg button[data-v=z]{background:#868e96;border-color:#868e96;color:#fff}
#adm .hint{display:none;margin-top:8px;font-size:.85rem;color:var(--mute)}
#adm .pr[data-m=u] .hu,#adm .pr[data-m=z] .hz{display:block}
#adm .lim{display:none;margin-top:8px;align-items:center;gap:8px;font-size:.85rem;flex-wrap:wrap}
#adm .pr[data-m=l] .lim{display:flex}
#adm .lim input{width:64px!important;text-align:center}
#adm .st{width:34px;height:34px;border-radius:50%;border:0;background:#1c7ed6;color:#fff;font-size:1.2rem;cursor:pointer}
#adm .chk{display:flex;gap:10px;align-items:center;margin:16px 0 0;font-weight:600;background:var(--bg);padding:10px 12px;border-radius:12px;border:1px solid var(--line);flex-wrap:wrap}#adm .chk input{width:64px!important;text-align:center}
#adm .foot{position:sticky;bottom:0;background:var(--card);padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
#adm .foot .btn{margin:0;flex:1;max-width:none;padding:12px;font-size:1rem}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:9px 4px;font-size:.8rem;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1 id="ttl">🎡 Lucky Wheel</h1>
  <p id="sub">Spin the wheel and win a surprise prize!</p>
</header>
<main>
  <section>
    <div class="wheelbox"><div class="pin"></div><canvas id="w" width="680" height="680"></canvas></div>
    <button class="btn" id="spin">SPIN!</button>
  </section>

<div style="text-align:center;margin-top:14px"><button class="link" id="gear" style="width:auto;display:inline-block;opacity:.35">⚙️</button></div>
</main>

<canvas id="cf" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:12"></canvas>
<div id="adm"><div class="box">
<div class="hd"><h2>Admin Panel</h2><p>Edit the wheel prizes here</p></div>
<div id="login"><label class="lb">Enter PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button class="btn" id="go">Log in</button><div id="pe2" style="color:#c92a2a;margin-top:8px"></div></div>
<div id="panel" style="display:none"><div class="bd2">
<div class="sec">1. Page text</div>
<label class="lb">Title</label><input id="eh">
<label class="lb">Subtitle</label><input id="es">
<label class="chk">Everyone can spin at most <input type="number" min="0" id="one"> times per day <small>(0 = unlimited)</small></label>
<div class="sec">2. Prizes</div>
<div class="legend"><span style="border-color:#2f9e44"><b>Unlimited:</b> any customer can win it</span><span style="border-color:#1c7ed6"><b>Daily limit:</b> only the number of people you choose can win it today</span><span style="border-color:#868e96"><b>Display only:</b> shown on the wheel but nobody wins it</span></div>
<div id="rows"></div></div>
<div class="foot"><button class="btn green" id="sv">Save</button><button class="btn" id="rs" style="background:#868e96">Reset today</button></div></div>
<button class="link" id="ax" style="padding:12px">Close</button></div></div>
<div id="modal"><div class="box">
  <div id="pe" style="font-size:4.5rem;line-height:1.2;text-align:center"></div>
  <div id="m1">Congratulations! You won:</div>
  <div class="prize" id="pt"></div>
  <button class="link" id="close">Close</button>
</div></div>

<script>
var P=[
 {t:"Free Coffee",e:"☕",c:"#8d5524"},
 {t:"10 Birr Off",e:"💸",c:"#2f9e44"},
 {t:"Free Juice",e:"🍹",c:"#f08c00"},
 {t:"50 Birr Off",e:"💰",c:"#1c7ed6"},
 {t:"Free Dessert",e:"🍰",c:"#d6336c"},
 {t:"100 Birr Off",e:"🎁",c:"#7048e8"},
 {t:"Free Tea",e:"🫖",c:"#0b7285"},
 {t:"20 Birr Off",e:"💵",c:"#e8590c"},
 {t:"Maybe Next Time",e:"😊",c:"#868e96",x:1}
];
var LIM={"Free Coffee":1,"Free Juice":1,"Free Tea":2,"Free Dessert":1,"50 Birr Off":3,"100 Birr Off":1};
var PIN="1234";
function day(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function ld(){var s={};try{s=JSON.parse(localStorage.getItem("cark")||"{}");}catch(e){}
 if(s.d!==day())s.w={};s.d=day();if(!s.l)s.l=JSON.parse(JSON.stringify(LIM));if(!s.w)s.w={};return s;}
function sv(){try{localStorage.setItem("cark",JSON.stringify(ST));}catch(e){}}
var TRN={"Ücretsiz Kahve":"Free Coffee","Ücretsiz Meyve Suyu":"Free Juice","Ücretsiz Tatlı":"Free Dessert","Ücretsiz Çay":"Free Tea","10 Birr İndirim":"10 Birr Off","20 Birr İndirim":"20 Birr Off","50 Birr İndirim":"50 Birr Off","100 Birr İndirim":"100 Birr Off","Bir Dahaki Sefere":"Maybe Next Time"};
function mig(){for(var k in TRN){var n=TRN[k];if(ST.l[k]!==undefined){ST.l[n]=ST.l[k];delete ST.l[k];}if(ST.w[k]!==undefined){ST.w[n]=ST.w[k];delete ST.w[k];}}}
var ST=ld();mig();
function left(t){var l=ST.l[t];if(l==null)return Infinity;return l-(ST.w[t]||0);}
function pick(){var ok=[];for(var i=0;i<P.length;i++){if(left(P[i].t)>0)ok.push(i);}if(!ok.length){for(var j=0;j<P.length;j++){if(P[j].x)ok=[j];}if(!ok.length)ok=[0];}return ok[Math.floor(Math.random()*ok.length)];}
function addWin(i){var t=P[i].t;ST.w[t]=(ST.w[t]||0)+1;sv();}
var tp=0,$=function(x){return document.getElementById(x);};
$("ttl").onclick=function(){tp++;setTimeout(function(){tp=0;},2500);if(tp>=5){tp=0;$("adm").classList.add("show");$("pin").value="";$("pe2").textContent="";$("login").style.display="";$("panel").style.display="none";}};
$("gear").onclick=function(){$("adm").classList.add("show");$("pin").value="";$("pe2").textContent="";$("login").style.display="";$("panel").style.display="none";};
$("rs").onclick=function(){ST.w={};try{localStorage.removeItem("carkspin");}catch(e){}sv();rows();lockUI();};
$("ax").onclick=function(){$("adm").classList.remove("show");};
function boom(){var c=document.getElementById("cf"),x=c.getContext("2d"),W=c.width=innerWidth,H=c.height=innerHeight,ps=[],cols=["#f03e3e","#fab005","#40c057","#228be6","#be4bdb","#fd7e14"],s,i;
 for(s=0;s<3;s++)for(i=0;i<70;i++){var a=-Math.PI/2+(Math.random()-.5)*1.5,v=9+Math.random()*10;ps.push({x:W*(.2+s*.3),y:H*.7,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:6+Math.random()*6,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[(i+s)%6]});}
 var t0=performance.now();(function f(n){x.clearRect(0,0,W,H);ps.forEach(function(p){p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});if(n-t0<3500)requestAnimationFrame(f);else x.clearRect(0,0,W,H);})(t0);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/'/g,"&#39;").replace(/"/g,"&quot;").replace(/</g,"&lt;");}
function lcfg(){try{var c=JSON.parse(localStorage.getItem("carkcfg")||"{}");P.forEach(function(p,i){if(c.t&&c.t[i])p.t=TRN[c.t[i]]||c.t[i];if(c.e&&c.e[i])p.e=c.e[i];});if(c.h&&c.h.indexOf("Şans")<0)document.getElementById("ttl").textContent=c.h;if(c.s&&c.s.indexOf("Çarkı")<0)document.getElementById("sub").textContent=c.s;}catch(e){}}
$("go").onclick=function(){if($("pin").value!==PIN){$("pe2").textContent="Wrong PIN";return;}$("login").style.display="none";$("panel").style.display="";rows();$("eh").value=$("ttl").textContent;$("es").value=$("sub").textContent;$("one").value=maxS();};
$("sv").onclick=function(){var cf={t:[],e:[],h:$("eh").value.trim(),s:$("es").value.trim()};
 Array.prototype.forEach.call($("rows").querySelectorAll(".pr"),function(r,i){var old=r.getAttribute("data-t"),m=r.getAttribute("data-m"),nw=r.querySelector(".nm").value.trim()||old,em=r.querySelector(".em").value.trim()||P[i].e;
  if(nw!==old){if(ST.w[old]!=null)ST.w[nw]=ST.w[old];delete ST.w[old];delete ST.l[old];}
  if(m=="u")delete ST.l[nw];else if(m=="z")ST.l[nw]=0;else ST.l[nw]=Math.max(1,parseInt(r.querySelector(".lim input").value,10)||1);
  P[i].t=nw;P[i].e=em;cf.t[i]=nw;cf.e[i]=em;});
 try{localStorage.setItem("carkcfg",JSON.stringify(cf));}catch(e){}
 try{localStorage.setItem("carkmax",String(Math.max(0,parseInt($("one").value,10)||0)));}catch(e){}
 sv();lockUI();if(cf.h)$("ttl").textContent=cf.h;if(cf.s)$("sub").textContent=cf.s;draw();$("adm").classList.remove("show");};
function rows(){var h="";P.forEach(function(p){var l=ST.l[p.t],m=l==null?"u":(l===0?"z":"l"),n=ST.w[p.t]||0;
h+="<div class='pr' data-t='"+esc(p.t)+"' data-m='"+m+"' style='border-left-color:"+p.c+"'>"
+"<div class='pn'><input class='em' value='"+esc(p.e)+"' maxlength='4'><input class='nm' value='"+esc(p.t)+"' maxlength='24'><span class='bd'>Given today: "+n+"</span></div>"
+"<div class='seg'><button type='button' data-v='u'>Unlimited</button><button type='button' data-v='l'>Daily limit</button><button type='button' data-v='z'>Display only</button></div>"
+"<div class='hint hu'>Can be won, no limit.</div><div class='hint hz'>Shown on the wheel but nobody wins it.</div>"
+"<div class='lim'>At most <button type='button' data-s='-1' class='st'>-</button><input type='number' min='1' value='"+(m=="l"?l:1)+"'><button type='button' data-s='1' class='st'>+</button> people can win it today</div></div>";});
$("rows").innerHTML=h;
Array.prototype.forEach.call($("rows").querySelectorAll(".pr"),function(r){r.onclick=function(e){var b=e.target.closest("button");if(!b)return;var v=b.getAttribute("data-v"),d=b.getAttribute("data-s");if(v)r.setAttribute("data-m",v);if(d){var i=r.querySelector(".lim input");i.value=Math.max(1,(parseInt(i.value,10)||1)+parseInt(d,10));}};});}
function maxS(){try{var v=localStorage.getItem("carkmax");if(v===null)return 2;return Math.max(0,parseInt(v,10)||0);}catch(e){return 2;}}
function cnt(){try{var o=JSON.parse(localStorage.getItem("carkspin")||"{}");return o.d===day()?o.n:0;}catch(e){return 0;}}
function mark(){try{localStorage.setItem("carkspin",JSON.stringify({d:day(),n:cnt()+1}));}catch(e){}}
function full(){var m=maxS();return m>0&&cnt()>=m;}
function lockUI(){var b=document.getElementById("spin"),m=maxS(),on=full();b.disabled=on;b.textContent=on?"Out of spins, come back tomorrow":(m>0?"SPIN! ("+(m-cnt())+" left)":"SPIN!");}
var cv=document.getElementById("w"),cx=cv.getContext("2d"),N=P.length,arc=Math.PI*2/N,rot=0,busy=false;
function lab(p){
 var w=p.t.split(" "),l;
 if(w[0]=="Free")l=[w[0],w.slice(1).join(" ")];else if(w.length>2)l=[w[0]+" "+w[1],w.slice(2).join(" ")];else l=w;
 cx.save();cx.translate(292,0);cx.rotate(Math.PI/2);cx.font="46px system-ui,sans-serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText(p.e,0,3);cx.restore();
 cx.save();cx.textAlign="right";cx.textBaseline="middle";cx.fillStyle="#fff";cx.shadowColor="rgba(0,0,0,.35)";cx.shadowBlur=3;
 var f=26;do{cx.font="700 "+f+"px system-ui,sans-serif";f--;}while(f>14&&Math.max(cx.measureText(l[0]).width,cx.measureText(l[1]||"").width)>140);
 cx.fillText(l[0],246,l[1]?-15:0);if(l[1])cx.fillText(l[1],246,15);
 cx.restore();
}
function draw(){
 var s=cv.width,r=s/2;cx.clearRect(0,0,s,s);
 for(var i=0;i<N;i++){
  var a=rot+i*arc;
  cx.beginPath();cx.moveTo(r,r);cx.arc(r,r,r-8,a,a+arc);cx.closePath();
  cx.fillStyle=P[i].c;cx.fill();cx.strokeStyle="#fff";cx.lineWidth=4;cx.stroke();
  cx.save();cx.translate(r,r);cx.rotate(a+arc/2);cx.textAlign="right";cx.fillStyle="#fff";
  lab(P[i]);
  cx.restore();
 }
 cx.beginPath();cx.arc(r,r,34,0,7);cx.fillStyle="#fff";cx.fill();cx.strokeStyle="#d9480f";cx.lineWidth=6;cx.stroke();
}
function spin(){
 if(busy)return;if(full()){lockUI();return;}busy=true;document.getElementById("spin").disabled=true;mark();
 var w=pick();
 var want=3*Math.PI/2-(w+0.5)*arc;
 var cur=((rot%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
 var d=((want-cur)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)+Math.PI*2*6;
 var start=rot,t0=performance.now(),dur=5000;
 function f(n){
  var k=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-k,4);
  rot=start+d*e;draw();
  if(k<1)requestAnimationFrame(f);else{busy=false;lockUI();win(w);}
 }
 requestAnimationFrame(f);
}
function win(i){
 var p=P[i];
 document.getElementById("pe").textContent=p.e;
 document.getElementById("pt").textContent=p.t;
 var em=!!p.x;
 document.getElementById("m1").textContent=em?"Not this time":"Congratulations! You won:";
 if(em)document.getElementById("pt").textContent="Better luck next time!";
 addWin(i);if(!em)boom();
 document.getElementById("modal").classList.add("show");
}
document.getElementById("spin").onclick=spin;
document.getElementById("close").onclick=function(){document.getElementById("modal").classList.remove("show");};
lcfg();draw();lockUI();
</script>
</body>
</html>
